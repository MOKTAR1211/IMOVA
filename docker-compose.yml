services:
  db:
    image: postgres:16-alpine
    container_name: immo229-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: immo229
      POSTGRES_USER: immo229
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immo229_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo229 -d immo229"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: immo229-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: immo229
      DB_USER: immo229
      DB_PASSWORD: ${POSTGRES_PASSWORD:-immo229_local_only}
      PORT: 5000
      FRONTEND_URL: http://localhost
      BACKEND_PUBLIC_URL: http://localhost:5000
      JWT_SECRET: ${JWT_SECRET:-local_dev_only_secret_change_before_deploy}
      MTN_MOMO_TARGET_ENVIRONMENT: sandbox
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_private_uploads:/app/backend/private-uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: immo229-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  backend_private_uploads:
